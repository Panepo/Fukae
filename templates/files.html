<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Indexer - File Manager</title>
  <link rel="stylesheet" href="../static/style.css">
</head>

<body>
  <div class="container">
    <h1>Document Indexer - File Manager</h1>
    <p>Download files from uploads and chunks directories.</p>

    <div class="form-group">
      <label for="bearerToken">Bearer Token:</label>
      <input type="text" id="bearerToken" name="bearerToken" value="" placeholder="Enter bearer token">
      <button id="loadFilesButton" onclick="loadFilesAfterToken()">Load Files</button>
    </div>

    <div class="tabs">
      <button class="tab-button active" onclick="showTab('uploads')">Uploads</button>
      <button class="tab-button" onclick="showTab('chunks')">Chunks</button>
    </div>

    <div id="uploadsTab" class="tab-content active">
      <h3>Uploads Directory</h3>
      <div id="uploadsList" class="file-list"></div>
    </div>

    <div id="chunksTab" class="tab-content">
      <h3>Chunks Directory</h3>
      <div id="chunksList" class="file-list"></div>
    </div>
  </div>

  <script>
    // Determine the base path for API calls and static files
    const currentPath = window.location.pathname;
    const pathParts = currentPath.split('/').filter(p => p.length > 0);
    let basePath = '';
    if (pathParts.length > 0 && !['upload', 'status', 'download', 'static', 'chunks', 'files'].includes(pathParts[0])) {
      basePath = '/' + pathParts[0];
    }
    let currentAuthToken = '';

    // Get bearer token from input
    const bearerTokenInput = document.getElementById('bearerToken');
    bearerTokenInput.addEventListener('input', function () {
      const token = this.value.trim();
      if (token !== '') {
        currentAuthToken = `Bearer ${token}`;
      } else {
        currentAuthToken = '';
      }
    });

    // Function to load files after token is entered
    function loadFilesAfterToken() {
      const token = bearerTokenInput.value.trim();
      if (token !== '') {
        currentAuthToken = `Bearer ${token}`;
        loadFiles('uploads');
        loadFiles('chunks');
      } else {
        alert('Please enter a bearer token first.');
      }
    }

    // Tab switching functionality
    function showTab(tabName) {
      // Hide all tab content
      const tabContents = document.querySelectorAll('.tab-content');
      tabContents.forEach(content => {
        content.classList.remove('active');
      });

      // Remove active class from all tab buttons
      const tabButtons = document.querySelectorAll('.tab-button');
      tabButtons.forEach(button => {
        button.classList.remove('active');
      });

      // Show selected tab content and activate button
      document.getElementById(tabName + 'Tab').classList.add('active');
      event.target.classList.add('active');
    }

    // Format file size
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Format date
    function formatDate(timestamp) {
      const date = new Date(timestamp * 1000);
      return date.toLocaleString();
    }

    // Load files from a directory
    async function loadFiles(directory) {
      const listContainer = document.getElementById(directory + 'List');
      listContainer.innerHTML = '<p>Loading files...</p>';

      try {
        const headers = {};
        if (currentAuthToken) {
          headers['Authorization'] = currentAuthToken;
        }

        const response = await fetch(basePath + `/files/${directory}/list`, {
          headers: headers
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        const files = data.files;

        if (files.length === 0) {
          listContainer.innerHTML = '<p>No files found in this directory.</p>';
          return;
        }

        // Sort files by name
        files.sort((a, b) => a.name.localeCompare(b.name));

        // Create file list
        let fileListHtml = '<table class="file-table"><thead><tr><th>File Name</th><th>Size</th><th>Modified</th><th>Action</th></tr></thead><tbody>';
        files.forEach(file => {
          fileListHtml += `
            <tr>
              <td>${file.name}</td>
              <td>${formatFileSize(file.size)}</td>
              <td>${formatDate(file.modified)}</td>
              <td><a href="#" onclick="downloadFile('${directory}', '${file.name}'); return false;">Download</a></td>
            </tr>
          `;
        });
        fileListHtml += '</tbody></table>';

        listContainer.innerHTML = fileListHtml;

      } catch (error) {
        listContainer.innerHTML = `<p>Error loading files: ${error.message}</p>`;
      }
    }

    // Download a file
    async function downloadFile(directory, filename) {
      const headers = {};
      if (currentAuthToken) {
        headers['Authorization'] = currentAuthToken;
      }

      try {
        const response = await fetch(basePath + `/download/${directory}/${filename}`, {
          headers: headers
        });

        if (!response.ok) {
          throw new Error(`Download failed: ${response.status} ${response.statusText}`);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        alert(`Download error: ${error.message}`);
      }
    }

    // Load files when page loads
    document.addEventListener('DOMContentLoaded', function () {
      // Initially show message that token is required
      const uploadsList = document.getElementById('uploadsList');
      const chunksList = document.getElementById('chunksList');
      uploadsList.innerHTML = '<p>Please enter a bearer token above and click "Load Files" to load files.</p>';
      chunksList.innerHTML = '<p>Please enter a bearer token above and click "Load Files" to load files.</p>';
    });
  </script>
</body>

</html>
