[project]
name = "fukae"
version = "0.1.0"
description = "Document indexing service"
requires-python = "==3.13.3"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "pytest>=7.4.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "poethepoet>=0.26.0",
]

[tool.uv]
package = false
prerelease = "allow"
link-mode = "copy"

[tool.poe.tasks]
install = "uv pip install -r requirements.txt"
dev = "python scripts/run_api_server.py"
